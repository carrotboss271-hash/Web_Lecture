<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Mouse Event</title>
</head>
<body>
    <h2>JavaScript 마우스 이벤트</h2>

    <div id="box" style="width:300px; height:150px;
        background-color:lightgray; text-align:center;">
        마우스를 올려보세요!
    </div>

    <script>
        let box = document.querySelector("#box");

        // 마우스를 올렸을 때
        box.addEventListener("mouseover", function() {
            box.style.backgroundColor = "skyblue";
            box.textContent = "마우스가 올라왔습니다!";
        });

        // 마우스가 벗어났을 때
        box.addEventListener("mouseout", function() {
            box.style.backgroundColor = "lightgray";
            box.textContent = "마우스를 올려보세요!";
        });
    </script>
</body>
</html>
